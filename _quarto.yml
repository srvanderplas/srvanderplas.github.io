project:
  type: website
  output-dir: "_site"
  pre-render:
    - code/create_posts.R

website:
  title: "Susan Vanderplas"
  site-url: "srvanderplas.github.io"
  navbar:
    right:
      - about.qmd
      - text: "More"
        menu:
          - publications.qmd
          - courses.qmd
          - talks.qmd
          - other.qmd
      - icon: github
        href: https://github.com/srvanderplas
        aria-label: Github
      - icon: file-person
        href: https://srvanderplas.github.io/CV/CV.pdf
        aria-label: CV
      - icon: fa-bluesky
        href: https://bsky.app/profile/srvanderplas.bsky.social
        aria-label: Bluesky
      - icon: mastodon
        href: https://mastodon.social/@srvanderplas
        aria-label: Mastodon

format:
  html:
#    axe:
#      output: document
    theme: a11y
    css: styles.css
    include-in-header: '<link rel="human-json" href="human.json">'


freeze: auto
